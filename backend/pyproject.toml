[project]
name = "autotune-ai"
version = "0.1.0"
description = "AutoTune AI — self-improving chatbot with LangGraph multi-agent pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",

    # Database
    "tortoise-orm==0.20.0",
    "asyncpg>=0.31.0",
    "aerich==0.7.2",

    # LangGraph + LangChain (Pipeline 1)
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",

    # Web Search & Scraping (Pipeline 1 Agent 2)
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",

    # Vector Store (Pipeline 2)
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "tomlkit>=0.13.0",

    # SQLite fix for ChromaDB (Linux only — uncomment if deploying to Linux)
    # "pysqlite3-binary>=0.5.4",
]

[tool.aerich]
tortoise_orm = "db.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
